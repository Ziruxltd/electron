<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Clases del Zepak</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>📚 Clases del Zepak</h1>
        <p class="subtitle">Consulta tu horario de clases al instante</p>
      </header>

      <main class="card">
        <div class="input-group">
          <button id="sendButton">
            <span id="sendButtonSpinner" class="spinner" hidden></span>
            <span id="sendButtonLabel">Ver mi horario</span>
          </button>
        </div>

        <div id="result" class="result"></div>
      </main>
    </div>

    <div id="sessionModalOverlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sessionModalTitle">
        <h2 id="sessionModalTitle">Sesión caducada</h2>
        <p>
          La sesión de WebUntis ha caducado. Copia estas 3 cookies desde las
          herramientas de desarrollador del navegador (con sesión iniciada en
          <em>ehu.webuntis.com</em> → Aplicación → Cookies) y pégalas aquí.
        </p>
        <form id="sessionForm">
          <div class="field">
            <label for="jsessionidInput">JSESSIONID</label>
            <input
              type="text"
              id="jsessionidInput"
              placeholder="Ej: CEA50C01B792628978A12A39E2BAFBE6"
              autocomplete="off"
              required
            />
          </div>
          <div class="field">
            <label for="schoolnameInput">schoolname</label>
            <input
              type="text"
              id="schoolnameInput"
              placeholder='Ej: "_ZWh1"'
              autocomplete="off"
              required
            />
          </div>
          <div class="field">
            <label for="tenantIdInput">Tenant-Id</label>
            <input
              type="text"
              id="tenantIdInput"
              placeholder='Ej: "6184100"'
              autocomplete="off"
              required
            />
          </div>
          <div class="modal-error" id="sessionModalError"></div>
          <div class="modal-actions">
            <button type="submit" id="sessionSubmitButton">Guardar y reintentar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
